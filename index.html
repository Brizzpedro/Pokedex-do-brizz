<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokedex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Pokedex</h1>

    <div class="pokeContainer" id="pokeContainer">

        <div class="pokemon">
            <div class="imgContainer">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/4.png" alt="Charmander">
            </div>

            <div class="info">
                <span class="number">#004</span>
                <h3 class="name">Charmander</h3>
                <small class="type">Type: Fire</small>
            </div>
        </div>


        <div class="pokemon">
            <div class="imgContainer">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/1.png" alt="Bulbasaur">
            </div>

            <div class="info">
                <span class="number">#001</span>
                <h3 class="name">Bulbasaur</h3>
                <small class="type">Type: Grass</small>
            </div>
        </div>


        <div class="pokemon">
            <div class="imgContainer">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/7.png" alt="Squirtle">
            </div>

            <div class="info">
                <span class="number">#007</span>
                <h3 class="name">Squirtle</h3>
                <small class="type">Type: Water</small>
            </div>
        </div>


        <div class="pokemon">
            <div class="imgContainer">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/10.png" alt="Caterpie">
            </div>

            <div class="info">
                <span class="number">#010</span>
                <h3 class="name">Caterpie</h3>
                <small class="type">Type: Bug</small>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
