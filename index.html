<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokédex Brizz</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-L8H5EGWDR2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-L8H5EGWDR2');
</script>
    
</head>

<body>

    <header class="header">

        <div class="logo">
            <span>POKÉDEX</span> <strong>BRIZZ</strong>
        </div>

        <div class="controls">

            <button type="button" id="randomPokemon">
                🎲 ALEATÓRIO
            </button>

            <button type="button" id="guessGame">
                🎮 QUEM É?
            </button>

            <button type="button" id="battleButton">
                ⚔️ BATALHAR
            </button>

            <button type="button" id="teamBattleButton">
                ⚔️ BATALHA DE TIMES
            </button>

        </div>

        <div class="searchBox">

            <input
                type="text"
                id="search"
                placeholder="Pesquisar Pokémon..."
                autocomplete="off"
            >

            <select id="typeFilter">

                <option value="all">Todos os tipos</option>

                <option value="normal">Normal</option>
                <option value="fire">Fogo</option>
                <option value="water">Água</option>
                <option value="electric">Elétrico</option>
                <option value="grass">Grama</option>
                <option value="ice">Gelo</option>
                <option value="fighting">Lutador</option>
                <option value="poison">Veneno</option>
                <option value="ground">Terrestre</option>
                <option value="flying">Voador</option>
                <option value="psychic">Psíquico</option>
                <option value="bug">Inseto</option>
                <option value="rock">Pedra</option>
                <option value="ghost">Fantasma</option>
                <option value="dragon">Dragão</option>
                <option value="dark">Sombrio</option>
                <option value="steel">Aço</option>
                <option value="fairy">Fada</option>

            </select>

        </div>

        <div class="generations">

            <button
                type="button"
                class="generation active"
                data-generation="all"
            >
                TODOS
            </button>

            <button
                type="button"
                class="generation"
                data-generation="1"
            >
                I
            </button>

            <button
                type="button"
                class="generation"
                data-generation="2"
            >
                II
            </button>

            <button
                type="button"
                class="generation"
                data-generation="3"
            >
                III
            </button>

            <button
                type="button"
                class="generation"
                data-generation="4"
            >
                IV
            </button>

            <button
                type="button"
                class="generation"
                data-generation="5"
            >
                V
            </button>

            <button
                type="button"
                class="generation"
                data-generation="6"
            >
                VI
            </button>

            <button
                type="button"
                class="generation"
                data-generation="7"
            >
                VII
            </button>

            <button
                type="button"
                class="generation"
                data-generation="8"
            >
                VIII
            </button>

            <button
                type="button"
                class="generation"
                data-generation="9"
            >
                IX
            </button>

        </div>

    </header>


    <section class="regionTitle">

        <div>

            <span id="regionGeneration">
                TODAS AS GERAÇÕES
            </span>

            <h2 id="regionName">
                TODOS OS POKÉMON
            </h2>

        </div>

        <strong id="regionNumber">
            1025 Pokémon
        </strong>

    </section>


    <main
        class="pokeContainer"
        id="pokeContainer"
    >

        <p class="loading">
            Carregando Pokémon...
        </p>

    </main>


    <!-- DETALHES -->

    <div
        class="detailsOverlay"
        id="detailsOverlay"
    >

        <div class="detailsCard">

            <button
                type="button"
                class="closeButton"
                id="closeDetails"
            >
                ×
            </button>

            <div id="detailsContent"></div>

        </div>

    </div>


    <!-- QUEM É ESSE POKÉMON -->

    <div
        class="gameOverlay"
        id="gameOverlay"
    >

        <div class="gameCard">

            <button
                type="button"
                class="closeButton"
                id="closeGame"
            >
                ×
            </button>

            <h2>
                QUEM É ESSE POKÉMON?
            </h2>

            <div class="score">

                Pontuação:
                <strong id="score">0</strong>

            </div>

            <img
                id="gameImage"
                class="gameImage"
                src=""
                alt="Pokémon"
            >

            <input
                type="text"
                id="gameInput"
                placeholder="Digite o nome..."
                autocomplete="off"
            >

            <button
                type="button"
                id="gameSubmit"
            >
                RESPONDER
            </button>

            <p id="gameResult"></p>

        </div>

    </div>


    <!-- BATALHA 1X1 -->

    <div
        class="detailsOverlay battleOverlay"
        id="battleOverlay"
    >

        <div class="detailsCard battleModal">

            <button
                type="button"
                class="closeButton"
                id="closeBattle"
            >
                ×
            </button>

            <h2>
                ⚔️ BATALHA POKÉMON
            </h2>

            <div class="battleSelectors">

                <div class="battleSelector">

                    <label>
                        Pokémon 1
                    </label>

                    <input
                        type="text"
                        id="battleSearch1"
                        class="battleSearch"
                        placeholder="Pesquisar Pokémon..."
                        autocomplete="off"
                    >

                    <select id="battlePokemon1">

                        <option value="">
                            Escolha o Pokémon
                        </option>

                    </select>

                    <div
                        id="preview1"
                        class="battlePreview"
                    >

                        <span>
                            Escolha um Pokémon
                        </span>

                    </div>

                </div>


                <div class="battleVS">
                    VS
                </div>


                <div class="battleSelector">

                    <label>
                        Pokémon 2
                    </label>

                    <input
                        type="text"
                        id="battleSearch2"
                        class="battleSearch"
                        placeholder="Pesquisar Pokémon..."
                        autocomplete="off"
                    >

                    <select id="battlePokemon2">

                        <option value="">
                            Escolha o Pokémon
                        </option>

                    </select>

                    <div
                        id="preview2"
                        class="battlePreview"
                    >

                        <span>
                            Escolha um Pokémon
                        </span>

                    </div>

                </div>

            </div>


            <button
                type="button"
                id="startBattle"
            >
                ⚔️ COMEÇAR BATALHA
            </button>


            <div
                id="battleArena"
                class="battleArena"
            ></div>

        </div>

    </div>


    <!-- BATALHA DE TIMES -->

    <div
        class="detailsOverlay teamBattleOverlay"
        id="teamBattleOverlay"
    >

        <div class="detailsCard teamBattleModal">

            <button
                type="button"
                class="closeButton"
                id="closeTeamBattle"
            >
                ×
            </button>


            <h2>
                ⚔️ BATALHA DE TIMES
            </h2>


            <p class="teamBattleSubtitle">
                RED × BLUE
            </p>


            <div class="teamsContainer">

                <div class="teamColumn redTeamColumn">

                    <h3>
                        🔴 TIME RED
                    </h3>

                    <div
                        id="redTeam"
                        class="teamPokemonList"
                    ></div>

                </div>


                <div class="teamColumn blueTeamColumn">

                    <h3>
                        🔵 TIME BLUE
                    </h3>

                    <div
                        id="blueTeam"
                        class="teamPokemonList"
                    ></div>

                </div>

            </div>


            <div class="teamFightArena">

                <div class="teamFighter">

                    <img
                        id="redFighterImage"
                        src=""
                        alt="Pokémon do time Red"
                    >

                    <strong id="redFighterName">
                        ---
                    </strong>

                    <div class="teamHPBar">

                        <div
                            id="redHP"
                            class="teamHPFill"
                        ></div>

                    </div>

                    <span id="redHPText">
                        0 HP
                    </span>

                </div>


                <div class="teamFightCenter">

                    <strong>
                        VS
                    </strong>

                    <span id="teamBattleMessage">
                        Sorteie os times!
                    </span>

                    <strong
                        id="teamBattleResult"
                        class="teamBattleWinner"
                    ></strong>

                </div>


                <div class="teamFighter">

                    <img
                        id="blueFighterImage"
                        src=""
                        alt="Pokémon do time Blue"
                    >

                    <strong id="blueFighterName">
                        ---
                    </strong>

                    <div class="teamHPBar">

                        <div
                            id="blueHP"
                            class="teamHPFill"
                        ></div>

                    </div>

                    <span id="blueHPText">
                        0 HP
                    </span>

                </div>

            </div>


            <div class="teamBattleButtons">

                <button
                    type="button"
                    id="newTeamsButton"
                >
                    🎲 NOVOS TIMES
                </button>

                <button
                    type="button"
                    id="startTeamBattle"
                >
                    ⚔️ COMEÇAR BATALHA
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
