<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokedex</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            <span>POKEDEX</span>
            <strong>BRIZZ</strong>
        </div>

        <p>Explore o mundo Pokémon</p>
    </header>

    <main>

        <section class="controls">

            <div class="searchBox">
                <span>🔎</span>
                <input
                    type="text"
                    id="search"
                    placeholder="Pesquisar Pokémon..."
                >
            </div>

            <select id="typeFilter">
                <option value="all">Todos os tipos</option>
                <option value="normal">Normal</option>
                <option value="fire">Fogo</option>
                <option value="water">Água</option>
                <option value="electric">Elétrico</option>
                <option value="grass">Grama</option>
                <option value="ice">Gelo</option>
                <option value="fighting">Lutador</option>
                <option value="poison">Veneno</option>
                <option value="ground">Terrestre</option>
                <option value="flying">Voador</option>
                <option value="psychic">Psíquico</option>
                <option value="bug">Inseto</option>
                <option value="rock">Pedra</option>
                <option value="ghost">Fantasma</option>
                <option value="dragon">Dragão</option>
                <option value="dark">Sombrio</option>
                <option value="steel">Aço</option>
                <option value="fairy">Fada</option>
            </select>

            <button id="randomPokemon">🎲 ALEATÓRIO</button>

            <button id="guessGame">🎮 QUEM É?</button>

            <button id="battleButton">⚔️ BATALHAR</button>

        </section>

        <section class="generations">

            <button class="generation active" data-generation="all">
                TODOS
            </button>

            <button class="generation" data-generation="1">
                I
            </button>

            <button class="generation" data-generation="2">
                II
            </button>

            <button class="generation" data-generation="3">
                III
            </button>

            <button class="generation" data-generation="4">
                IV
            </button>

            <button class="generation" data-generation="5">
                V
            </button>

            <button class="generation" data-generation="6">
                VI
            </button>

            <button class="generation" data-generation="7">
                VII
            </button>

            <button class="generation" data-generation="8">
                VIII
            </button>

            <button class="generation" data-generation="9">
                IX
            </button>

        </section>

        <section class="regionTitle">

            <span id="regionGeneration">
                TODAS AS GERAÇÕES
            </span>

            <h2 id="regionName">
                TODOS OS POKÉMON
            </h2>

            <p id="regionNumber">
                1025 Pokémon
            </p>

        </section>

        <section
            id="pokeContainer"
            class="pokeContainer"
        ></section>

    </main>

    <div
        id="detailsOverlay"
        class="detailsOverlay"
    >

        <div class="detailsCard">

            <button
                id="closeDetails"
                class="closeDetails"
            >
                ✕
            </button>

            <div id="detailsContent"></div>

        </div>

    </div>

    <div
        id="gameOverlay"
        class="gameOverlay"
    >

        <div class="gameCard">

            <button
                id="closeGame"
                class="closeGame"
            >
                ✕
            </button>

            <h2>🎮 QUEM É ESSE POKÉMON?</h2>

            <img
                id="gameImage"
                class="gameImage"
                src=""
                alt="Pokémon"
            >

            <input
                type="text"
                id="gameInput"
                placeholder="Digite o nome do Pokémon..."
                autocomplete="off"
            >

            <button id="gameSubmit">
                RESPONDER
            </button>

            <div id="gameResult"></div>

            <div class="score">
                Pontuação: <span id="score">0</span>
            </div>

        </div>

    </div>

    <div
        id="battleOverlay"
        class="battleOverlay"
    >

        <div class="battleModal">

            <button
                id="closeBattle"
                class="closeBattle"
            >
                ✕
            </button>

            <h2>⚔️ BATALHA POKÉMON</h2>

            <p class="battleSubtitle">
                Escolha dois Pokémon para começar a batalha
            </p>

            <div class="battleSelectors">

                <div class="battleSelector">

                    <label>
                        Pokémon 1
                    </label>

                    <input
                        type="text"
                        id="battleSearch1"
                        class="battleSearch"
                        placeholder="Pesquisar Pokémon..."
                        autocomplete="off"
                    >

                    <select id="battlePokemon1"></select>

                    <div
                        id="preview1"
                        class="battlePreview"
                    ></div>

                </div>

                <div class="battleVS">
                    VS
                </div>

                <div class="battleSelector">

                    <label>
                        Pokémon 2
                    </label>

                    <input
                        type="text"
                        id="battleSearch2"
                        class="battleSearch"
                        placeholder="Pesquisar Pokémon..."
                        autocomplete="off"
                    >

                    <select id="battlePokemon2"></select>

                    <div
                        id="preview2"
                        class="battlePreview"
                    ></div>

                </div>

            </div>

            <button
                id="startBattle"
                class="startBattle"
            >
                ⚔️ COMEÇAR BATALHA
            </button>

            <div
                id="battleArena"
                class="battleArena"
            ></div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
